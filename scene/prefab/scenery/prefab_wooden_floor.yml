---
prefab:
  mesh:
    vertex:
      type: plane
    material:
      prefab: materials/Planks09
      # scale-relative: 0.6 tiles/unit == old "tiling: 60" at scale 100,
      # now consistent density at any node scale (200, 4000, ...)
      tiling: 0.6
      scale_tiling: true
    flags:
      pre_depth: true
  flags:
    no_shadow: true
    nav_mesh: true
  physics:
    geom:
      type: plane
      category: terrain
      collision: [npc, player, prop]
      size: [1000, 0.2, 1000]
