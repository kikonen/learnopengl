---
prefab:
  id: prefab_time_text
  type: text
  mesh:
    material:
      kd: [0.0, 0.8, 0.0, 1.0]
      map_displacement: ""
      xmras: [1.0, 0.0, 1]
      alpha: true
      xblend: true
      render_back: true
      default_programs: false
      program: g_font_render
      oit_program: oit_font_render
      shadow_program: shadow_font_render
      selection_program: selection_font_render
      id_program: object_id_font_render
      shared_definitions:
        USE_OUTLINE: 1
  text:
    text: "HH:MM"
    font:
      path: fonts/VeraMono.ttf
      #path: fonts/LuckiestGuy.ttf
      #path: fonts/BLADRMF_.TTF
      size: 64
    align_horizontal: right
    align_vertical: top
  flags:
    no_shadow: true
    no_frustum: true
  controllers:
    - type: clock
  base_scale: 0.01
