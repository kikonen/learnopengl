---
meta:
  name: Material balls
skybox:
  program: g_skybox
  xmaterial: skybox
  material: skybox/polyhaven/borghese_gardens_4k.hdr
  xmaterial: skybox/polyhaven/circus_arena_4k.hdr
  xmaterial: skybox/polyhaven/drakensberg_solitary_mountain_4k.hdr
  xmaterial: skybox/polyhaven/gray_pier_4k.hdr
  xmaterial: skybox/polyhaven/wasteland_clouds_puresky_4k.hdr
  material: skybox/polyhaven/qwantani_noon_puresky_4k.hdr
  xmaterial_2: skybox/polyhaven/qwantani_night_puresky_4k.hdr
  material_2: skybox/polyhaven/satara_night_no_lamps_4k.hdr
script:
  scripts:
    - path: lib/common

includes:
  - path: prefab/util/include_ui_time_text.yml

world:
  time_base: "1942-06-20T12:00:00"
  time_scale: 2000
  sun_up: "06:00"
  sun_down: "18:00"
  sun_angle: 25
  sun_twilight_angle: 18
  day_color: [1.0, 0.98, 0.95]
  dusk_color: [1.0, 0.55, 0.25]
  night_color: [0.35, 0.45, 0.70]

types:
  - id: ibl_probe
    flags:
      environment_probe: true
  - id: world_origo
    mesh:
      path: water_ball
      material_modifier:
        kd: [0.0, 0.2, 0.8, 1.0]
      program: g_tex
  - id: player
    type: origo
    front: [0, 0, -1]
    audio:
      listener:
        default: true
    camera:
      default: true
    controllers:
      - type: pawn
      - type: camera_zoom
  - id: dir_light
    mesh:
      vertex:
        type: sphere
        size: [1]
        radius: 1
      material_modifier:
        kd: [0.8, 0.8, 0.6, 1.0]
      program: g_light
    flags:
      no_shadow: true
    light:
      type: directional
      sun: true
      diffuse: [0.7, 0.7, 0.7, 1.0]
      intensity: 20000
      moon_intensity_scale: 0.3
    controllers:
      - type: sun
        distance: 40
  - id: moon_marker
    mesh:
      vertex:
        type: sphere
        radius: 0.5
      material_modifier:
        kd: [0.5, 0.6, 0.9, 1.0]
      program: g_light
    flags:
      no_shadow: true
    controllers:
      - type: moon
        distance: 40
  - id: point_light
    mesh:
      vertex:
        type: sphere
        size: [1]
        radius: 1
      material_modifier:
        kd: [0.8, 0.8, 0.6, 1.0]
      program: g_light
    flags:
      no_shadow: true
    light:
      type: point
      linear: 0.14
      quadratic: 0.07
      diffuse: [0.7, 0.7, 0.7, 1.0]
      intensity: 1000
  - id: ball_origo
    type: origo
    script: |
      cmd:rotate(
        self.handle,
        { time=100 * 100 },
        vec3(0, 1, 0),
        360 * 100)
  - id: basic_ball
    mesh:
      path: water_ball
      material:
        name: default_ball
        kd: [0.8, 0.8, 0.0, 1.0]
        xreflection: 0.05
        mras: [0.2, 0.1, 1.0, 0]
      program: g_tex
    flags:
      environment: true
  - id: gold_ball
    mesh:
      path: water_ball
      material:
        #prefab: materials/Planks09.yml
        prefab: materials/Metal007.yml
        kd: [0.7516, 0.6065, 0.2265, 1.0]
        xreflection: 0.05
        parallax: 0.0
      program: g_tex
    flags:
      environment: true
  - id: silver_ball
    mesh:
      path: water_ball
      material:
        name: silver_ball
        prefab: materials/Fence007A.yml
        kd: [0.5075, 0.5075, 0.5075, 1.0]
        tiling: 1.5
        scale_tiling: true
        xreflection: 0.05
        parallax: 0.0
        alpha: true
        xblend: true
        render_back: true
      program: g_tex
    flags:
      environment: true
  - id: bronze_ball
    mesh:
      path: water_ball
      material:
        name: plastic_ball
        prefab: materials/Plastic01.yml
        kd: [0.7140, 0.4284, 0.1814, 1.0]
        xreflection: 0.05
        parallax: 0.0
      program: g_tex
    flags:
      environment: true
  - id: rusted_iron_ball
    mesh:
      path: water_ball
      material:
        base: textures\Metal022_1K-PNG
        kd: [0.7140, 0.4284, 0.1814, 1.0]
        map_kd: Metal022_1K_Color.png
        map_normal: Metal022_1K_NormalGL.png
        map_mras: Metal022_1K_mras
        map_displacement: Metal022_1K_displacement
        xreflection: 0.05
        tiling: 3
        parallax: 0.0
      program: g_tex
    flags:
      environment: true
  - id: old_gold_ball
    mesh:
      path: water_ball
      material:
        name: bronze_ball
        prefab: materials/Metal008.yml
        kd: [0.7140, 0.4284, 0.1814, 1.0]
        xreflection: 0.05
        tiling: 3
        parallax: 0.0
      program: g_tex
    flags:
      environment: true
  - id: bubble_base
    mesh:
      vertex:
        type: sphere
        radius: 0.5
      material:
        kd: [0.1, 0.8, 0.9, 0.2]
        blend: true
        render_back: true
        program: effect_bubble
        program_definitions:
          EFFECT_ENV_DIM: 1
    flags:
      effect: true
      no_select: true
      no_shadow: true
    script_file: scripts/anim_bubble.lua
  - id: bubble
    base: bubble_base
    init_script: |
      self.bubble = {
        max = 5,
      }
  - id: bubble_small
    base: bubble_base
    init_script: |
      self.bubble = {
        max = 3,
      }
  - id: wooden_floor
    prefab:
      path: prefab/scenery/prefab_wooden_floor.yml
    flags:
      environment: true
  - id: fence
    mesh:
      path: quad
      material:
        name: fence
        prefab: materials/Fence007A.yml
        kd: [0.800000, 0.800000, 0.800000, 1.0]
        parallax: 0.0
        tiling: 0.3
        scale_tiling: true
        alpha: true
        render_back: true
      program: g_tex
    flags:
      environment: true

nodes:
  - type: prefab_ui_time_text
    id: ui_time_text
    pos: [2, 2, -1]
  - type: ibl_probe
    pos: [0, 2, 0]
  - type: world_origo
    pos: [0.0, 0.0, 0.0]
    scale: 1
  - type: player
    pos: [0, 5, 40]
    active: true
  - type: dir_light
    pos: [-25, 25, 0]
    scale: 1.5
  - type: moon_marker
    pos: [0, 0, 0]
    scale: 1.0
  - type: point_light
    pos: [10, 10, 25]
    scale: 0.5
  - type: ball_origo
    pos: [0.0, 5.0, 0.0]
    children:
      - type: basic_ball
        pos: [0.0, 0.0, 0.0]
        scale: 1.3
      - type: gold_ball
        pos: [0.0, 0.0, 5.0]
        scale: 1.3
      - type: silver_ball
        pos: [0.0, 0.0, 10.0]
        scale: 1.3
      - type: bronze_ball
        pos: [0.0, 0.0, 15.0]
        scale: 1.3
      - type: rusted_iron_ball
        pos: [0.0, 0.0, 20.0]
        scale: 1.3
      - type: old_gold_ball
        pos: [0.0, 0.0, 25.0]
        scale: 1.3

      - type: bubble_small
        pos: [0.0, 0.0, 25.0]
        scale: 1.3
        init_script: |
          self.bubble = {
            min = 3,
            max = 4,
            time = 1.5,
            delay = 2
          }
        script: |
          printf("NODE_SCRIPT_TEST: %s\n", self.handle)

  - type: bubble
    scale: 1
    position: [5, 2, 12]
  - type: wooden_floor
    scale: 100
    position: [0, 0, 0]
  - xtype: wooden_floor
    scale: 100
    rot: [180, 0, 0]
    position: [0, 15, 0]
  - type: fence
    pos: [20.0, 5, -25]
    scale: 5
    rotation: [0, 270, 0]
    repeat:
      z_count: 5
      z_step: 10
